services:
  mysql-db:
    image: mysql:8.0
    container_name: social_mysql
    restart: always
    environment:
      MYSQL_DATABASE: social_scheduler
      MYSQL_ROOT_PASSWORD: Rishabh
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis-server:
    image: redis:latest
    container_name: social_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  mysql_data: